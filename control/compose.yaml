services:
  control_center:
    build: ./streamlit
    container_name: streamlit_control_center
    working_dir: /app/streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
      # Raiz do repo: inventory.yaml + tools/deploy.sh (botão "Atualizar Código").
      # Escrita necessária: o deploy regenera build/ e control/prometheus.yaml.
      - ../:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ssh:/root/.ssh:ro
    environment:
      - REPO_PATH=/repo
      - PROMETHEUS_URL=http://prometheus:9090 # resultados de sistema na tab 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml # gerado por tools/gen_configs.py
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=180d' # guardar as métricas das experiências (artigo)
      - '--web.enable-lifecycle'             # recarregar config: curl -X POST localhost:9090/-/reload
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource + dashboards a partir de ficheiros (ver docs/control.md)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      # Só é usada na PRIMEIRA criação do volume. Para mudar depois:
      # docker exec -it grafana grafana cli admin reset-admin-password <nova>
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always

# Nomes fixos: sem "name", o Docker prefixa com o nome da pasta (gossip_ui_..., control_...)
# e uma mudança de pasta cria volumes novos e vazios -> dashboards/métricas "perdidas".
volumes:
  prometheus_data:
    name: control_prometheus_data
  grafana_data:
    name: control_grafana_data